<!DOCTYPE html>
<html>
  <head>
    <title>My python activities (compiled for Windows)</title>
    <meta content="width=device-width,initial-scale=1" name="viewport" />
    <link rel="stylesheet" href="global.css" />
  </head>

  <body>

    <nav>
      <ul class="navigation">
        <li><a href="index.html">Home</a></li>
        <li><a href="pythonactivities.html">Python activities</a></li>
        <li class="current"><a href="compiled_programs.html">Compiled programs</a></li>
        <li><a href="studyings.html">Studyings</a></li>
      </ul>
    </nav>
    
    <header>
      <div class="header-right"></div>
      <div class="os">
        <p class="alert">
          Sorry ! It seems that you can't download the following programs
          because this device is not running Windows.
        </p>
      </div>
      <p>
        <a class="downloadLink" href="output/aloha from hawaï.exe" download
          >aloha from hawaï.exe</a
        >
      </p>

      <p>
        <a class="downloadLink" href="output/calculatrice.exe" download
          >calculatrice.exe</a
        >
      </p>
      <p>
        <a class="downloadLink" href="output/compte.exe" download>compte.exe</a>
      </p>

      <p>
        <a class="downloadLink" href="output/conversion.exe" download
          >conversion.exe</a
        >
      </p>

      <input type="checkbox" id="allowDownloads">
      <label for="allowDownloads" id="allowDownloadsLabel">Allow downloads anyway</label>
    </header>

    <script>

      let elOS = document.querySelector(".os");
      //let elDownload = document.querySelector(".download");

      let elDownloadLinks = document.querySelectorAll(".downloadLink");

      let allowDownloadsButton = document.getElementById("allowDownloads");
      allowDownloadsButton.checked = false;
      let allowDownloadsLabel = document.getElementById("allowDownloadsLabel");
      let downloadsEnabled = false;

      allowDownloadsButton.addEventListener("click", setDownloadsState)

      //let elAlert = document.querySelector(".alert");
      console.log(navigator.platform);

      allowDownloadsButton.hidden = true;
      allowDownloadsLabel.hidden = true
      elOS.classList.add("hide");
      let platform = "Win32";
      if (navigator.platform != platform) {
        //elDownload.setAttribute("disabled", true);
        for (link of elDownloadLinks) {
          link.classList.add("disabled");
          allowDownloadsButton.hidden = false;
          allowDownloadsLabel.hidden = false;
          console.log(link);
        }
        //elAlert.innerHTML("Oops ! You can't download these files because this device is not using Windows !");
        elOS.classList.remove("hide");
      }

      function enableDownloadLinks() {

        for (link of elDownloadLinks) {
            link.classList.remove("disabled");
        }
        downloadsEnabled = true;
        elOS.classList.add("hide");
      }

      function disableDownloadLinks() {

        for (link of elDownloadLinks) {
          link.classList.add("disabled");
        }

        elOS.classList.remove("hide");
        downloadsEnabled = false;
      }

      function setDownloadsState(){
        if(downloadsEnabled === true) {
          disableDownloadLinks();
        } else {
          enableDownloadLinks();
        }
      }
    </script>

    <style>
      .os.hide {
        display: none;
      }
      os {
        display: block;
      }
      .alert {
        color: red;
      }
      .downloadLink.disabled {
        pointer-events: none;
        color: grey;
      }

      .downloadLink {
        width: 50px;
        height: 50px;
        color: lightgreen;
      }
    </style>
  </body>
</html>
